[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmstxt-gen"
version = "0.2.0"
description = "AST-aware llms.txt generator for Python and JavaScript/TypeScript codebases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Omar Shariff Delmo", email = "omarshariffd@gmail.com" }]
keywords = ["llms.txt", "ast", "documentation", "llm", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "pathspec>=0.12",
    "tree-sitter-java>=0.21",
    "tree-sitter-ruby>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-swift>=0.7.2",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-scala>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "tiktoken>=0.7",
]
tokens = ["tiktoken>=0.7"]

[project.scripts]
llmstxt-gen = "llmstxt_gen.cli:app"

[project.urls]
Homepage = "https://github.com/wuzzzzaah/llmstxt-gen"
Repository = "https://github.com/wuzzzzaah/llmstxt-gen"
Documentation = "https://github.com/wuzzzzaah/llmstxt-gen/tree/main/docs"
Issues = "https://github.com/wuzzzzaah/llmstxt-gen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llmstxt_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/llmstxt_gen"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
source = ["src/llmstxt_gen"]
branch = true

[tool.llmstxt_gen]
name = "llmstxt-gen"
description = "AST-aware llms.txt generator"
include = ["src/"]
exclude = ["tests/", "docs/"]
languages = ["python"]
